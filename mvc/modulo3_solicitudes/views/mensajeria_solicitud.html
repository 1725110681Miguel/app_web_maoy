$def with (mensajes, csrf)
$var titulo: Mensajes de la solicitud
$if mensajes:
    <ol class="mensajes">
    $for m in mensajes:
        <li class="$('propio' if m['propio'] else 'recibido')"><strong>$("Tú" if m["propio"] else "Contacto")</strong> <time>$m['fecha_envio']</time><p>$m['contenido']</p>
        $if m['propio']:
            <small>$("Leído" if m["leido"] else "Enviado")</small>
        </li>
    </ol>
$else:
    <div class="vacio"><p>Todavía no hay mensajes en esta solicitud.</p></div>
<form method="post"><input type="hidden" name="csrf" value="$csrf"><label>Tu mensaje<textarea name="contenido" required maxlength="4000"></textarea></label><button>Enviar mensaje</button></form>

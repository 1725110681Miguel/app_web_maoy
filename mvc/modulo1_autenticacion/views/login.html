$def with (correo, error, aviso, token)
$var titulo: Iniciar sesión
<h1>Iniciar sesión</h1>
<p class="ayuda">Entra con el correo y la contraseña de tu cuenta.</p>
$if aviso:
    <p class="alerta exito" role="status">$aviso</p>
$if error:
    <p class="alerta error" role="alert">$error</p>
<form method="post" action="/login">
    <input type="hidden" name="csrf" value="$token">
    <label>Correo electrónico
        <input type="email" name="correo" value="$correo" maxlength="100" autocomplete="email" required>
    </label>
    <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Iniciar sesión</button>
    <p class="ayuda">¿Aún no tienes cuenta? <a href="/registro">Regístrate aquí</a>.</p>
</form>
